# nRF54L15 Firmware Configuration (Zephyr / nRF Connect SDK)

# Enable Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# BLE features
CONFIG_BT_DEVICE_NAME="PQ-BLE-Device"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0

# GATT
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_WRITE_WITHOUT_RESPONSE=y

# Increase MTU for larger payloads
CONFIG_BT_L2CAP_TX_MTU=517
CONFIG_BT_BUF_ACL_RX_SIZE=520
CONFIG_BT_BUF_ACL_TX_SIZE=520

# Security (not used for application-layer security)
CONFIG_BT_SMP=n

# Logging
CONFIG_LOG=y
CONFIG_BT_DEBUG_LOG=n

# nRF54L15 specific
CONFIG_SOC_SERIES_NRF54L=y