# Bluetooth core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PQ-BLE-Device"
CONFIG_BT_DEVICE_APPEARANCE=0

# No BLE Security Manager pairing.
# PQ-BLE provides security at application layer.
CONFIG_BT_SMP=n

# GATT / ATT
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=517

# Buffers
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10

# Stack sizes
# Previous main stack: 20480 B. On-device ML-KEM decapsulation overflowed it,
# so reserve 24576 B for the next measurement build.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Main-thread stack high-water mark measurement. Both options are required by
# k_thread_stack_space_get() in the Zephyr version supplied with NCS 3.0.0.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
