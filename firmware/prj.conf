# Bluetooth core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PQ-BLE-Device"
CONFIG_BT_DEVICE_APPEARANCE=0

# No BLE Security Manager pairing.
# PQ-BLE provides security at application layer.
CONFIG_BT_SMP=n

# GATT / ATT
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=517

# Buffers
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10

# Stack sizes
# Keep the validated Phase 1 main-stack allocation unchanged for this first
# integration build. Normal Phase 2 KeyGen and Decapsulation execute only on
# the dedicated worker configured below.
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_PQ_MLKEM_THREAD_STACK_SIZE=28672
CONFIG_PQ_MLKEM_THREAD_PRIORITY=14

# Thread stack high-water mark measurement. Both options are required by
# k_thread_stack_space_get() in the Zephyr version supplied with NCS 3.0.0.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# CRC-32/IEEE for the TEST-ONLY shared-secret diagnostic checksum.
CONFIG_CRC=y

# Phase 3: PSA Crypto for HKDF-SHA256 and AES-256-GCM
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_GCM=y

CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_256=y

CONFIG_PSA_WANT_GENERATE_RANDOM=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
