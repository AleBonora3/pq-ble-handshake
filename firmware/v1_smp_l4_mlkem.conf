# v1.0 profile: BLE SMP Security Mode 1 Level 4 + ML-KEM-768
#
# Build (from the firmware directory):
#   west build -b nrf54l15dk/nrf54l15/cpuapp -p always -- \
#     -DCONF_FILE=prj.conf -DEXTRA_CONF_FILE=v1_smp_l4_mlkem.conf
#
# prj.conf remains the unmodified v0.7 baseline (CONFIG_BT_SMP=n). This
# fragment is applied after prj.conf, so its assignments win. Every symbol
# below was checked against nRF Connect SDK 3.0.0 / sdk-zephyr v4.0.99-ncs1.

# Select the v1.0 application profile (firmware/Kconfig).
CONFIG_PQ_PROFILE_V10_SMP_L4_MLKEM=y

# --- Security Manager: authenticated LE Secure Connections only -------------
# BT_SMP_SC_ONLY selects BT_SMP_SC_PAIR_ONLY (legacy pairing disabled) and
# forces every bt_conn_set_security() request to BT_SECURITY_L4. The host
# rejects Just Works with "authentication requirements" because L4 needs an
# authenticated method (subsys/bluetooth/host/smp.c, remote_sec_level_reachable).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
# Default y; stated explicitly because L4 requires the MITM flag.
CONFIG_BT_SMP_ENFORCE_MITM=y
# Observe/restrict each incoming pairing attempt; this does not confirm NC.
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Application explicitly restores bonds; cold pairing belongs to WinRT.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
# Prompt hidden under BT_SMP_SC_ONLY; default 16. Stated for documentation.
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
# Bond the Windows Central; an unauthenticated peer may never replace a bond.
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=n
CONFIG_BT_MAX_PAIRED=2

# --- Bond persistence (Scenario B: bonded reconnection) ----------------------
# nRF54L15 RRAM: 4 KiB erase blocks, 36 KiB "storage" fixed partition in the
# board devicetree -> 9 ZMS sectors. Zephyr's SETTINGS_BACKEND choice picks
# SETTINGS_ZMS automatically when ZMS=y. settings_load() is called from
# main() after bt_enable() (see pq_v1_security_settings_load()).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# --- Human Numeric Comparison confirmation on the DK -------------------------
# Nordic DK button/LED library (selects GPIO). DK_BTN1 = devicetree sw0 =
# silkscreen "BUTTON 0" on the nRF54L15 DK.
CONFIG_DK_LIBRARY=y

# BT_ECC (selected by BT_SMP) performs the SMP P-256 ECDH through PSA Crypto;
# the required PSA_WANT_* symbols are already enabled by prj.conf.
